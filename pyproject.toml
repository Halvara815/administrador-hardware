[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "administrador-hardware"
version = "0.1.0"
description = "Aplicación local de diagnóstico de hardware para Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter",
    "pillow",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pip-audit",
    "pyinstaller",
    "pytest",
    "ruff",
    "types-psutil",
]

[project.scripts]
administrador-hardware = "hardware_admin.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hardware_admin = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "scratch/pytest-cache-verify"
# La captura por defecto de pytest ("fd") sustituye los descriptores 0/1/2 del
# proceso. Tcl los necesita al crear un intérprete: con ellos redirigidos falla
# al leer init.tcl y aborta con «Can't find a usable init.tcl ... couldn't read
# file: No error», aunque el archivo exista y sea legible. El fallo es
# intermitente y depende del orden de las pruebas, así que aparecía unas veces
# sí y otras no. Capturar a nivel de sys deja intactos los descriptores.
# Esto NO omite ninguna prueba: las de interfaz siguen ejecutándose todas.
addopts = "--capture=sys"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# El conjunto por defecto de ruff no incluye E402 ni el orden de imports:
# por eso los imports a media altura de core.py pasaron sin senalarse.
extend-select = ["E402", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hardware_admin"]

[[tool.mypy.overrides]]
module = ["customtkinter"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hardware_admin.ui.*"]
disallow_subclassing_any = false
