[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "administrador-hardware"
version = "0.1.0"
description = "Aplicación local de diagnóstico de hardware para Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter",
    "pillow",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pyinstaller",
    "pytest",
    "ruff",
    "types-psutil",
]

[project.scripts]
administrador-hardware = "hardware_admin.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hardware_admin"]

[[tool.mypy.overrides]]
module = ["customtkinter"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hardware_admin.ui.*"]
disallow_subclassing_any = false
